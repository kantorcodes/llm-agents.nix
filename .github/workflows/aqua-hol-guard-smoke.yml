name: Aqua HOL Guard smoke
on:
  push:
    branches:
      - validation/aqua-hol-guard-exec
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.63.0
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - name: Create focused registry config and policy
        run: |
          git init
          cat > registry.yaml <<'EOF'
          ---
          packages:
            - type: github_release
              repo_owner: hashgraph-online
              repo_name: hol-guard
              asset: hol-guard-core-{{trimV .Version}}-x86_64-unknown-linux-gnu
              format: raw
              github_artifact_attestations:
                signer_workflow: hashgraph-online/hol-guard/.github/workflows/publish.yml
              supported_envs:
                - linux/amd64
          EOF
          cat > aqua-smoke.yaml <<'EOF'
          ---
          checksum:
            enabled: true
          registries:
            - name: hol-guard-local
              type: local
              path: registry.yaml
          packages:
            - name: hashgraph-online/hol-guard@v3.0.189
              registry: hol-guard-local
          EOF
          cat > aqua-policy.yaml <<'EOF'
          ---
          registries:
            - name: hol-guard-local
              type: local
              path: registry.yaml
          packages:
            - registry: hol-guard-local
          EOF
          aqua policy allow "$PWD/aqua-policy.yaml"
      - name: Install HOL Guard through Aqua
        run: aqua i
        env:
          AQUA_CONFIG: ${{ github.workspace }}/aqua-smoke.yaml
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - name: Execute HOL Guard through Aqua
        run: aqua exec -- hol-guard --version
        env:
          AQUA_CONFIG: ${{ github.workspace }}/aqua-smoke.yaml
          AQUA_GITHUB_TOKEN: ${{ github.token }}
