name: Regenerate HOL Guard package docs
on:
  push:
    branches:
      - feat/hol-guard
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/hol-guard
      - uses: cachix/install-nix-action@v31
      - name: Regenerate package docs
        run: ./scripts/generate-package-docs.nu
      - name: Commit generated README
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: regenerate package list"
          git push origin HEAD:feat/hol-guard
